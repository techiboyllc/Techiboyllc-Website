  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

option value=\"aa00ff\">Ultra Violet<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n  <div class=\"tweak-row\">\n    <label class=\"tweak-label\">Particle Density<\u002Flabel>\n    <input type=\"range\" class=\"tweak-range\" id=\"tweak-particles\" min=\"30\" max=\"200\" value=\"80\" oninput=\"updateParticles(this.value)\">\n  <\u002Fdiv>\n  <div class=\"tweak-row\">\n    <label class=\"tweak-label\">Cursor Trail<\u002Flabel>\n    <select class=\"tweak-select\" id=\"tweak-trail\" onchange=\"applyTweaks()\">\n      <option value=\"dots\">Dots<\u002Foption>\n      <option value=\"sparks\">Sparks<\u002Foption>\n      <option value=\"none\">None<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n  <div class=\"tweak-check-row\">\n    <input type=\"checkbox\" class=\"tweak-check\" id=\"tweak-scanlines\" checked=\"\" onchange=\"applyTweaks()\">\n    <label class=\"tweak-label\" style=\"margin:0\">Scanlines<\u002Flabel>\n  <\u002Fdiv>\n  <div class=\"tweak-check-row\">\n    <input type=\"checkbox\" class=\"tweak-check\" id=\"tweak-grid\" onchange=\"applyTweaks()\">\n    <label class=\"tweak-label\" style=\"margin:0\">Always Show Grid<\u002Flabel>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n// ─── TWEAKS SYSTEM ────────────────────────────────────\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"accentColor\": \"dc1428\",\n  \"particleDensity\": 80,\n  \"cursorTrail\": \"dots\",\n  \"scanlines\": true,\n  \"alwaysGrid\": false\n}/*EDITMODE-END*/;\n\nwindow.addEventListener('message', e => {\n  if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('visible');\n  if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('visible');\n});\nwindow.parent.postMessage({ type: '__edit_mode_available' }, '*');\n\nfunction hexToRgb(hex) {\n  const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);\n  return `${r},${g},${b}`;\n}\nfunction applyTweaks() {\n  const color = document.getElementById('tweak-color').value;\n  const rgb = hexToRgb(color);\n  const root = document.documentElement;\n  root.style.setProperty('--red', `#${color}`);\n  root.style.setProperty('--red-glow', `#${color}`);\n  root.style.setProperty('--red-dim', `rgba(${rgb},0.5)`);\n  document.querySelectorAll('.tech-dot, .status-dot').forEach(d => d.style.background = `#${color}`);\n  // scanlines\n  document.body.style.setProperty('--scanlines', document.getElementById('tweak-scanlines').checked ? 'block' : 'none');\n  if (!document.getElementById('tweak-scanlines').checked) document.body.classList.add('no-scanlines');\n  else document.body.classList.remove('no-scanlines');\n  // grid\n  const grid = document.querySelector('.holo-grid');\n  if (grid) grid.style.opacity = document.getElementById('tweak-grid').checked ? '1' : '';\n  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: color } }, '*');\n}\nfunction updateParticles(val) {\n  PARTICLE_COUNT = parseInt(val);\n  if (typeof initParticles === 'function') initParticles();\n}\n<\u002Fscript>\n\n<style>\nbody.no-scanlines::after { display: none; }\n<\u002Fstyle>\n\n<script>\n// ─── CURSOR ───────────────────────────────────────────\nconst orb = document.getElementById('cursor-orb');\nconst ring = document.getElementById('cursor-ring');\nlet mx = 0, my = 0, rx = 0, ry = 0;\nlet trailTimer = 0;\n\ndocument.addEventListener('mousemove', e => {\n  mx = e.clientX; my = e.clientY;\n  orb.style.left = mx + 'px';\n  orb.style.top = my + 'px';\n  // Trail\n  const trailStyle = document.getElementById('tweak-trail')?.value || 'dots';\n  if (trailStyle !== 'none') {\n    const now = Date.now();\n    if (now - trailTimer > 25) {\n      trailTimer = now;\n      const t = document.createElement('div');\n      t.className = 'cursor-trail';\n      t.style.left = mx + 'px';\n      t.style.top = my + 'px';\n      if (trailStyle === 'sparks') {\n        const angle = Math.random() * Math.PI * 2;\n        const dist = Math.random() * 20;\n        t.style.left = (mx + Math.cos(angle)*dist) + 'px';\n        t.style.top = (my + Math.sin(angle)*dist) + 'px';\n        t.style.width = '3px'; t.style.height = '3px';\n      }\n      document.body.appendChild(t);\n      setTimeout(() => t.remove(), 600);\n    }\n  }\n});\n\nfunction lerpRing() {\n  rx += (mx - rx) * 0.12;\n  ry += (my - ry) * 0.12;\n  ring.style.left = rx + 'px';\n  ring.style.top = ry + 'px';\n  requestAnimationFrame(lerpRing);\n}\nlerpRing();\n\ndocument.querySelectorAll('a, button, .service-panel, .test-card, .portfolio-card, .about-stat').forEach(el => {\n  el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));\n  el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));\n});\n\n// ─── PROGRESS BAR ─────────────────────────────────────\nconst bar = document.getElementById('progress-bar');\nwindow.addEventListener('scroll', () => {\n  const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;\n  bar.style.width = pct + '%';\n});\n\n// ─── SCROLL REVEAL ────────────────────────────────────\nconst reveals = document.querySelectorAll('.reveal');\nconst obs = new IntersectionObserver(entries => {\n  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });\n}, { threshold: 0.12 });\nreveals.forEach(r => obs.observe(r));\n\n// ─── SERVICE PANEL TILT ───────────────────────────────\ndocument.querySelectorAll('.service-panel').forEach(panel => {\n  panel.addEventListener('mousemove', e => {\n    const rect = panel.getBoundingClientRect();\n    const x = (e.clientX - rect.left) / rect.width;\n    const y = (e.clientY - rect.top) / rect.height;\n    const rotX = (y - 0.5) * -12;\n    const rotY = (x - 0.5) * 12;\n    panel.style.transform = `perspective(600px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateZ(10px)`;\n    panel.style.setProperty('--mx', (x * 100) + '%');\n    panel.style.setProperty('--my', (y * 100) + '%');\n  });\n  panel.addEventListener('mouseleave', () => {\n    panel.style.transform = '';\n  });\n});\n\n// ─── CAROUSEL ─────────────────────────────────────────\nlet carouselIdx = 0;\nconst track = document.getElementById('carousel-track');\nconst cards = track.querySelectorAll('.portfolio-card');\nconst dots = document.querySelectorAll('.c-dot');\nconst totalSlides = 3; // 6 cards, show 3 at a time -> 2 positions + start\n\nfunction goToSlide(idx) {\n  carouselIdx = Math.max(0, Math.min(idx, cards.length - 3));\n  const cardW = track.querySelector('.portfolio-card').offsetWidth + 24;\n  track.style.transform = `translateX(-${carouselIdx * cardW}px)`;\n  dots.forEach((d, i) => d.classList.toggle('active', Math.floor(carouselIdx / 1) === i || (i === 2 && carouselIdx >= 2)));\n  dots.forEach((d,i) => d.classList.remove('active'));\n  const dotIdx = Math.min(Math.floor(carouselIdx / 2), 2);\n  dots[dotIdx]?.classList.add('active');\n}\ndocument.getElementById('next-btn').addEventListener('click', () => goToSlide(carouselIdx + 1));\ndocument.getElementById('prev-btn').addEventListener('click', () => goToSlide(carouselIdx - 1));\ndots.forEach(d => d.addEventListener('click', () => goToSlide(parseInt(d.dataset.idx) * 2)));\n\n// ─── CTA SUBMIT ──────────────────────────────────────\nfunction handleSubmit(e) {\n  e.preventDefault();\n  const btn = e.target.querySelector('.cta-submit');\n  btn.textContent = 'Sending...';\n  setTimeout(() => { btn.textContent = 'Received ✓'; btn.style.background = '#00aa55'; }, 1200);\n}\n\n// ─── POLICY MODALS ────────────────────────────────────\nconst policies = {\n  privacy: {\n    eyebrow: '// Legal Document',\n    heading: 'Privacy Policy',\n    updated: 'Last updated: April 21, 2026',\n    body: `\n      <div class=\"policy-highlight\">\n        Your privacy is critically important to us. Techiboy LLC operates techiboyllc.com and is committed to protecting any information you share with us.\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">1. Information We Collect<\u002Fdiv>\n        <p class=\"policy-text\">We collect information you voluntarily provide when you contact us, place an order, or subscribe to our communications. This may include:<\u002Fp>\n        <ul class=\"policy-list\">\n          <li><strong>Personal Identification:<\u002Fstrong> Name, email address, phone number, and business name.<\u002Fli>\n          <li><strong>Project Information:<\u002Fstrong> Brand details, industry, preferences, and any files or assets you share for your logo design project.<\u002Fli>\n          <li><strong>Payment Information:<\u002Fstrong> Billing details processed securely through third-party payment processors. We do not store credit card numbers on our servers.<\u002Fli>\n          <li><strong>Usage Data:<\u002Fstrong> IP address, browser type, pages visited, and time spent on our website — collected automatically via cookies and analytics tools.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">2. How We Use Your Information<\u002Fdiv>\n        <p class=\"policy-text\">The information we collect is used exclusively to:<\u002Fp>\n        <ul class=\"policy-list\">\n          <li>Deliver and manage your logo design and branding projects.<\u002Fli>\n          <li>Communicate updates, proofs, and revisions related to your order.<\u002Fli>\n          <li>Process payments and send invoices or receipts.<\u002Fli>\n          <li>Improve our website experience and service quality.<\u002Fli>\n          <li>Send occasional promotional emails (you may opt out at any time).<\u002Fli>\n          <li>Comply with legal obligations where required.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">3. Data Sharing & Third Parties<\u002Fdiv>\n        <p class=\"policy-text\">Techiboy LLC <strong>does not sell, trade, or rent<\u002Fstrong> your personal information to third parties. We may share data with trusted service providers who assist in operating our business — such as payment processors, email platforms, and cloud storage — solely to fulfill our services. These parties are contractually obligated to keep your information confidential.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">4. Cookies<\u002Fdiv>\n        <p class=\"policy-text\">Our website uses cookies to enhance your browsing experience, analyze traffic, and remember your preferences. You may disable cookies in your browser settings; however, some features of the site may not function properly. By continuing to use our site, you consent to our use of cookies.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">5. Data Security<\u002Fdiv>\n        <p class=\"policy-text\">We implement industry-standard security measures — including SSL encryption, secure servers, and restricted access protocols — to protect your personal data from unauthorized access, alteration, disclosure, or destruction. However, no method of internet transmission is 100% secure, and we cannot guarantee absolute security.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">6. Your Rights<\u002Fdiv>\n        <p class=\"policy-text\">You have the right to access, correct, or delete your personal data at any time. To exercise these rights, contact us at <strong>support@techiboyllc.com<\u002Fstrong>. We will respond within 30 days.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">7. Children's Privacy<\u002Fdiv>\n        <p class=\"policy-text\">Our services are not directed to individuals under the age of 13. We do not knowingly collect personal information from children. If you believe a child has provided us with personal data, please contact us immediately.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">8. Contact Us<\u002Fdiv>\n        <p class=\"policy-text\">For any privacy-related questions or concerns, please reach out to:<br><br>\n        <strong>Techiboy LLC<\u002Fstrong><br>\n        Email: support@techiboyllc.com<br>\n        Website: techiboyllc.com<\u002Fp>\n      <\u002Fdiv>\n    `\n  },\n  terms: {\n    eyebrow: '// Legal Document',\n    heading: 'Terms & Conditions',\n    updated: 'Last updated: April 21, 2026',\n    body: `\n      <div class=\"policy-highlight\">\n        By accessing techiboyllc.com or placing an order with Techiboy LLC, you agree to be bound by these Terms and Conditions. Please read them carefully before engaging our services.\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">1. Services<\u002Fdiv>\n        <p class=\"policy-text\">Techiboy LLC provides custom logo design, brand identity, and related graphic design services. All services are rendered according to the package selected and subject to the terms outlined herein. We reserve the right to decline any project at our discretion.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">2. Intellectual Property & Ownership<\u002Fdiv>\n        <p class=\"policy-text\">Upon receipt of full payment, the client receives <strong>full ownership and copyright<\u002Fstrong> of the final approved logo design. Techiboy LLC retains the right to display completed work in our portfolio unless otherwise agreed in writing. All preliminary concepts, rejected designs, and working files remain the property of Techiboy LLC unless explicitly included in the agreed deliverables.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">3. Trademark Notice<\u002Fdiv>\n        <p class=\"policy-text\">It is the client's sole responsibility to ensure that the final logo design does not infringe upon any existing trademarks, service marks, or intellectual property rights. Techiboy LLC performs a general visual review but does <strong>not conduct formal trademark searches<\u002Fstrong>. We strongly recommend consulting a trademark attorney before commercializing your logo. Techiboy LLC assumes no liability for trademark conflicts arising after delivery.<\u002Fp>\n        <ul class=\"policy-list\">\n          <li>Clients should conduct trademark searches via the USPTO (United States Patent and Trademark Office) or relevant national trademark office.<\u002Fli>\n          <li>Techiboy LLC is not responsible for legal disputes arising from similarity to existing marks.<\u002Fli>\n          <li>Any indemnification costs resulting from trademark infringement are the sole responsibility of the client.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">4. Revisions & Client Feedback<\u002Fdiv>\n        <p class=\"policy-text\">Each package includes a specified number of revision rounds. Revisions must be requested within <strong>14 days<\u002Fstrong> of receiving each design proof. Failure to respond within this window may result in the project being marked complete. Additional revisions beyond the package limit are available at an additional fee.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">5. Payment Terms<\u002Fdiv>\n        <p class=\"policy-text\">Full payment is required before work commences unless otherwise agreed. We accept major credit cards, PayPal, and other methods specified at checkout. All prices are in USD. Techiboy LLC reserves the right to update pricing at any time; changes will not affect confirmed orders.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">6. Turnaround Time<\u002Fdiv>\n        <p class=\"policy-text\">Estimated delivery times are provided as guidance and are not guaranteed. Delays caused by client feedback response times, holidays, or force majeure are not the responsibility of Techiboy LLC. Rush orders may be available for an additional fee.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">7. Limitation of Liability<\u002Fdiv>\n        <p class=\"policy-text\">Techiboy LLC's total liability for any claim arising from our services shall not exceed the amount paid for the specific project in dispute. We are not liable for indirect, incidental, or consequential damages including but not limited to loss of profit, loss of business, or reputational harm.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">8. Governing Law<\u002Fdiv>\n        <p class=\"policy-text\">These Terms are governed by the laws of the United States. Any disputes shall be resolved through good-faith negotiation. If unresolved, disputes shall be submitted to binding arbitration.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">9. Contact<\u002Fdiv>\n        <p class=\"policy-text\"><strong>Techiboy LLC<\u002Fstrong><br>Email: support@techiboyllc.com<br>Website: techiboyllc.com<\u002Fp>\n      <\u002Fdiv>\n    `\n  },\n  refund: {\n    eyebrow: '// Legal Document',\n    heading: 'Refund Policy',\n    updated: 'Last updated: April 21, 2026',\n    body: `\n      <div class=\"policy-highlight\">\n        We stand behind our work with a 100% Satisfaction Guarantee. If you are not happy with the results, we will make it right — or refund you. Here is exactly how it works.\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">1. Our Satisfaction Guarantee<\u002Fdiv>\n        <p class=\"policy-text\">Techiboy LLC is committed to delivering logo designs you love. We offer unlimited revisions within your package until you are satisfied. If after completing all revision rounds you are still not satisfied, you may be eligible for a refund under the conditions below.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">2. Full Refund Eligibility<\u002Fdiv>\n        <p class=\"policy-text\">You are eligible for a <strong>full refund<\u002Fstrong> if:<\u002Fp>\n        <ul class=\"policy-list\">\n          <li>You request a refund <strong>before any design concepts have been delivered<\u002Fstrong> to you.<\u002Fli>\n          <li>You request a refund within <strong>24 hours<\u002Fstrong> of placing your order and no work has commenced.<\u002Fli>\n          <li>We are unable to deliver your project within twice the stated turnaround time due to our own delay.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">3. Partial Refund Eligibility<\u002Fdiv>\n        <p class=\"policy-text\">You may be eligible for a <strong>partial refund<\u002Fstrong> if:<\u002Fp>\n        <ul class=\"policy-list\">\n          <li>Initial concepts have been delivered but no revisions have been requested — a 50% refund may be issued.<\u002Fli>\n          <li>Revisions are in progress but the project is less than 50% complete as determined by Techiboy LLC — a partial refund may be negotiated.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">4. No Refund Situations<\u002Fdiv>\n        <p class=\"policy-text\">Refunds will <strong>not<\u002Fstrong> be issued in the following circumstances:<\u002Fp>\n        <ul class=\"policy-list\">\n          <li>The final logo has been approved and all files have been delivered.<\u002Fli>\n          <li>The client has used the logo commercially in any form.<\u002Fli>\n          <li>Revisions were completed and the client did not respond within the 14-day feedback window.<\u002Fli>\n          <li>The refund request is based on a change of mind after all revision rounds are exhausted.<\u002Fli>\n          <li>The client provided incomplete, inaccurate, or misleading project brief information.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">5. How to Request a Refund<\u002Fdiv>\n        <p class=\"policy-text\">To initiate a refund request, please contact us at <strong>support@techiboyllc.com<\u002Fstrong> with your order details and reason for the request. We aim to respond within <strong>2 business days<\u002Fstrong>. Approved refunds are processed within 5–10 business days back to your original payment method.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">6. Chargebacks<\u002Fdiv>\n        <p class=\"policy-text\">We ask that you contact us directly before initiating a chargeback with your bank or payment provider. Unauthorized chargebacks on completed work will be disputed and may result in being barred from future services. We are always willing to resolve issues fairly — please reach out first.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"policy-section\">\n        <div class=\"policy-section-title\">7. Contact Us<\u002Fdiv>\n        <p class=\"policy-text\"><strong>Techiboy LLC<\u002Fstrong><br>Email: support@techiboyllc.com<br>Website: techiboyllc.com<br><br>We are here to help — our goal is always a happy client and a great logo.<\u002Fp>\n      <\u002Fdiv>\n    `\n  }\n};\n\nfunction openPolicy(type) {\n  const p = policies[type];\n  const overlay = document.getElementById('policy-overlay');\n  document.getElementById('policy-eyebrow').textContent = p.eyebrow;\n  document.getElementById('policy-heading').textContent = p.heading;\n  document.getElementById('policy-updated').textContent = p.updated;\n  document.getElementById('policy-body').innerHTML = p.body;\n  document.body.style.overflow = 'hidden';\n  overlay.classList.add('open');\n  requestAnimationFrame(() => overlay.classList.add('visible'));\n}\nfunction closePolicy(e, force) {\n  if (!force && e && document.getElementById('policy-modal').contains(e.target)) return;\n  const overlay = document.getElementById('policy-overlay');\n  overlay.classList.remove('visible');\n  setTimeout(() => { overlay.classList.remove('open'); document.body.style.overflow = ''; }, 350);\n}\n// ESC handled by unified keydown listener below\n// Make legal links hoverable for cursor\ndocument.querySelectorAll('.legal-link, .policy-close, .policy-close-btn').forEach(el => {\n  el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));\n  el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));\n});\n// ─── LOADER ───────────────────────────────────────────\n(function() {\n  const loaderBar = document.getElementById('loader-bar');\n  const loaderPct = document.getElementById('loader-pct');\n  const loaderStatus = document.getElementById('loader-status');\n  const loader = document.getElementById('loader');\n  if (!loader) return;\n  const statuses = ['Initializing systems...','Loading design engine...','Calibrating visuals...','Rendering 3D assets...','Almost ready...'];\n  let pct = 0, si = 0;\n\n  function dismissLoader() {\n    if (loaderStatus) loaderStatus.textContent = 'Welcome.';\n    if (loaderBar) loaderBar.style.width = '100%';\n    if (loaderPct) loaderPct.textContent = '100%';\n    loader.classList.add('hidden');\n    document.body.style.overflow = '';\n  }\n\n  // Hard safety — always dismiss within 3.5s no matter what\n  const safetyTimer = setTimeout(dismissLoader, 3500);\n\n  document.body.style.overflow = 'hidden';\n\n  const iv = setInterval(() => {\n    const jump = Math.random() * 18 + 6;\n    pct = Math.min(pct + jump, 100);\n    if (loaderBar) loaderBar.style.width = pct + '%';\n    if (loaderPct) loaderPct.textContent = Math.floor(pct) + '%';\n    if (si < statuses.length - 1 && pct > si * 22) {\n      if (loaderStatus) loaderStatus.textContent = statuses[++si];\n    }\n    if (pct >= 100) {\n      clearInterval(iv);\n      clearTimeout(safetyTimer);\n      setTimeout(dismissLoader, 300);\n    }\n  }, 140);\n})();\n\n// ─── MOBILE MENU ──────────────────────────────────────\nfunction toggleMenu() {\n  const menu = document.getElementById('mobile-menu');\n  const ham = document.getElementById('hamburger');\n  if (!menu) return;\n  const open = menu.classList.toggle('open');\n  if (ham) ham.classList.toggle('open', open);\n  document.body.style.overflow = open ? 'hidden' : '';\n}\ndocument.addEventListener('keydown', e => {\n  if (e.key === 'Escape') {\n    const m = document.getElementById('mobile-menu');\n    if (m && m.classList.contains('open')) toggleMenu();\n    closePolicy(null, true);\n  }\n});\n\n// ─── BILLING TOGGLE ───────────────────────────────────\nvar isAnnual = false;\nfunction toggleBilling() {\n  isAnnual = !isAnnual;\n  const toggle = document.getElementById('billing-toggle');\n  if (toggle) toggle.classList.toggle('on', isAnnual);\n  const ml = document.getElementById('monthly-label');\n  const al = document.getElementById('annual-label');\n  if (ml) ml.classList.toggle('active', !isAnnual);\n  if (al) al.classList.toggle('active', isAnnual);\n  document.querySelectorAll('.price-amount').forEach(el => {\n    const target = parseInt(isAnnual ? el.dataset.annual : el.dataset.monthly);\n    const start = parseInt(el.textContent);\n    const diff = target - start;\n    let i = 0; const steps = 20;\n    const iv = setInterval(() => {\n      i++;\n      el.textContent = Math.round(start + diff * (i / steps));\n      if (i >= steps) clearInterval(iv);\n    }, 20);\n  });\n}\n\n(function initHero() {\n  const canvas = document.getElementById('hero-canvas');\n  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n  renderer.setSize(window.innerWidth, window.innerHeight);\n\n  const scene = new THREE.Scene();\n  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);\n  camera.position.set(0, 0, 5);\n\n  // Particles\n  let PARTICLE_COUNT = 80;\n  let particleGeo, particleMat, particleMesh;\n\n  function initParticles() {\n    if (particleMesh) scene.remove(particleMesh);\n    particleGeo = new THREE.BufferGeometry();\n    const positions = new Float32Array(PARTICLE_COUNT * 3);\n    const velocities = [];\n    for (let i = 0; i < PARTICLE_COUNT; i++) {\n      positions[i*3] = (Math.random()-0.5)*20;\n      positions[i*3+1] = (Math.random()-0.5)*20;\n      positions[i*3+2] = (Math.random()-0.5)*10;\n      velocities.push({ x:(Math.random()-0.5)*0.005, y:(Math.random()-0.5)*0.005, z:0 });\n    }\n    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));\n    particleGeo.userData.velocities = velocities;\n    particleMat = new THREE.PointsMaterial({ color: 0xdc1428, size: 0.06, transparent: true, opacity: 0.6, sizeAttenuation: true });\n    particleMesh = new THREE.Points(particleGeo, particleMat);\n    scene.add(particleMesh);\n  }\n  initParticles();\n  window.initParticles = initParticles;\n\n  // Holographic logo rings\n  const ringGroup = new THREE.Group();\n  [0.8, 1.2, 1.7].forEach((r, i) => {\n    const geo = new THREE.TorusGeometry(r, 0.008 + i*0.002, 8, 80);\n    const mat = new THREE.MeshBasicMaterial({\n      color: i === 0 ? 0xdc1428 : i === 1 ? 0x882030 : 0x440f18,\n      transparent: true, opacity: 0.7 - i*0.15\n    });\n    const ring = new THREE.Mesh(geo, mat);\n    ring.rotation.x = Math.PI/2 + i * 0.2;\n    ring.userData.speed = 0.003 + i*0.001;\n    ring.userData.axis = i % 2 === 0 ? 'y' : 'x';\n    ringGroup.add(ring);\n  });\n\n  // Outer scanning ring\n  const scanGeo = new THREE.TorusGeometry(2.2, 0.003, 4, 100);\n  const scanMat = new THREE.MeshBasicMaterial({ color: 0xff3344, transparent: true, opacity: 0.3 });\n  const scanRing = new THREE.Mesh(scanGeo, scanMat);\n  scanRing.rotation.x = Math.PI/2;\n  ringGroup.add(scanRing);\n\n  // Central T shape (logo core)\n  const coreGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);\n  const coreMat = new THREE.MeshBasicMaterial({ color: 0xff2233 });\n  const core = new THREE.Mesh(coreGeo, coreMat);\n  ringGroup.add(core);\n\n  // Icosahedron wireframe\n  const icoGeo = new THREE.IcosahedronGeometry(0.55, 1);\n  const icoMat = new THREE.MeshBasicMaterial({ color: 0xdc1428, wireframe: true, transparent: true, opacity: 0.25 });\n  const ico = new THREE.Mesh(icoGeo, icoMat);\n  ringGroup.add(ico);\n\n  scene.add(ringGroup);\n\n  // Light beams\n  const beamGroup = new THREE.Group();\n  for (let i = 0; i < 5; i++) {\n    const bGeo = new THREE.CylinderGeometry(0.003, 0.003, 20, 4);\n    const bMat = new THREE.MeshBasicMaterial({ color: 0xdc1428, transparent: true, opacity: 0.07 + i*0.01 });\n    const beam = new THREE.Mesh(bGeo, bMat);\n    beam.position.x = (i - 2) * 2.5;\n    beam.position.y = 0;\n    beam.rotation.z = -0.05 + i * 0.025;\n    beamGroup.add(beam);\n  }\n  scene.add(beamGroup);\n\n  // Grid floor\n  const gridHelper = new THREE.GridHelper(40, 40, 0x220008, 0x110004);\n  gridHelper.position.y = -2.5;\n  scene.add(gridHelper);\n\n  // Mouse influence\n  let targetX = 0, targetY = 0;\n  document.addEventListener('mousemove', e => {\n    targetX = (e.clientX / window.innerWidth - 0.5) * 0.5;\n    targetY = (e.clientY / window.innerHeight - 0.5) * 0.3;\n  });\n\n  let t = 0;\n  function animate() {\n    requestAnimationFrame(animate);\n    t += 0.008;\n\n    // Rotate rings\n    ringGroup.children.forEach((child, i) => {\n      if (child.userData.speed) {\n        if (child.userData.axis === 'y') child.rotation.y += child.userData.speed;\n        else child.rotation.x += child.userData.speed;\n      }\n    });\n    ico.rotation.y += 0.006;\n    ico.rotation.x += 0.003;\n    ringGroup.rotation.y += (targetX - ringGroup.rotation.y) * 0.04;\n    ringGroup.rotation.x += (-targetY - ringGroup.rotation.x) * 0.04;\n\n    // Scan ring pulse\n    scanRing.material.opacity = 0.15 + Math.sin(t * 2) * 0.15;\n\n    // Particles float\n    const pos = particleGeo.attributes.position.array;\n    const vel = particleGeo.userData.velocities;\n    for (let i = 0; i < PARTICLE_COUNT; i++) {\n      pos[i*3] += vel[i].x;\n      pos[i*3+1] += vel[i].y + Math.sin(t + i) * 0.001;\n      if (pos[i*3+1] > 10) pos[i*3+1] = -10;\n      if (pos[i*3] > 10) pos[i*3] = -10;\n    }\n    particleGeo.attributes.position.needsUpdate = true;\n\n    // Beams sway\n    beamGroup.rotation.y = Math.sin(t * 0.3) * 0.05;\n\n    // Grid scroll\n    gridHelper.position.z = (t * 0.5) % 1;\n\n    // Camera subtle bob\n    camera.position.y = Math.sin(t * 0.4) * 0.1;\n\n    renderer.render(scene, camera);\n  }\n  animate();\n\n  window.addEventListener('resize', () => {\n    camera.aspect = window.innerWidth / window.innerHeight;\n    camera.updateProjectionMatrix();\n    renderer.setSize(window.innerWidth, window.innerHeight);\n  });\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
